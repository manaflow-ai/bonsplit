name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_26.0.1.app/Contents/Developer

      - name: Resolve dependencies
        run: swift package resolve

      - name: Probe (debug)
        run: swift test --filter "ZZProbeHintTests" 2>&1 | grep -E "PROBE|error|passed|failed"

      - name: Probe (release)
        run: swift test -c release -Xswiftc -enable-testing --filter "ZZProbeHintTests" 2>&1 | grep -E "PROBE|error|passed|failed"
